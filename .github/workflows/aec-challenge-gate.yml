# AEC-Challenge perceptual-quality gate (ENFORCED as of v0.4.1).
#
# Runs the current chain against the 30-clip Microsoft AEC-Challenge subset
# (per docs/adr/0012-phase-1-acceptance-bar.md §2.1 v2 floors + §3.1
# applicability matrix) on PRs that touch the chain code or eval tooling.
# The "primary" run uses the v0.4.1 default config (AGC on); its exit code
# drives the workflow result. A second "regression baseline" run with
# --no-agc captures the legacy AGC-off behaviour for side-by-side diffing
# but does not block the workflow.
#
# Caches:
#   * vendor/  — fetched once per scripts/fetch-vendor.sh content hash
#   * build/   — cmake build output (webrtc-apm Meson build is the slow part)
#   * models/  — DNSMOS + AECMOS ONNX downloads
#
# Wall time:
#   * cold cache: ~15 min (webrtc-apm Meson + cmake build dominates)
#   * warm cache: ~3 min (incremental cmake + the actual chain runs)

name: aec-challenge-gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'reference/**'
      - 'datasets/aec_challenge/MANIFEST.tsv'
      - '.github/workflows/aec-challenge-gate.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vendor/MANIFEST.tsv'
      - 'scripts/fetch-vendor.sh'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'reference/**'
      - 'datasets/aec_challenge/MANIFEST.tsv'
      - '.github/workflows/aec-challenge-gate.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vendor/MANIFEST.tsv'
      - 'scripts/fetch-vendor.sh'

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OS build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config \
            libsndfile1-dev libspeexdsp-dev python3-pip
          # jammy's apt meson is 0.61; vendor/webrtc-audio-processing
          # requires >= 0.63. pip meson lands in /usr/local/bin which
          # precedes /usr/bin on the runner PATH.
          sudo python3 -m pip install --quiet 'meson==1.4.1'
          python3 --version
          cmake --version
          meson --version

      # jammy's libabsl-dev (20210324) predates absl/base/nullability.h,
      # which webrtc-audio-processing-2's installed public headers include.
      # Building one modern abseil and pointing BOTH our cmake targets and
      # the vendored Meson build at it mirrors the local-dev topology
      # (single absl everywhere; no mixed-version link against the copy
      # the Meson build would otherwise vendor in as a subproject).
      - name: Cache abseil install
        id: cache-absl
        uses: actions/cache@v4
        with:
          path: ~/absl-install
          key: absl-20240722.1-${{ runner.os }}-jammy-v1

      - name: Build abseil from source
        if: steps.cache-absl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 20240722.1 \
            https://github.com/abseil/abseil-cpp.git /tmp/absl-src
          cmake -S /tmp/absl-src -B /tmp/absl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            -DABSL_PROPAGATE_CXX_STD=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DABSL_BUILD_TESTING=OFF -DABSL_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/absl-install"
          cmake --build /tmp/absl-build -j$(nproc)
          cmake --install /tmp/absl-build

      - name: Expose abseil to pkg-config + cmake
        run: |
          echo "PKG_CONFIG_PATH=$HOME/absl-install/lib/pkgconfig:$HOME/absl-install/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/absl-install" >> "$GITHUB_ENV"
          pkg-config --modversion absl_strings || ls "$HOME/absl-install/lib" "$HOME/absl-install/lib/pkgconfig" 2>/dev/null || true

      - name: Cache vendor/ (rnnoise + speexdsp pinned sources)
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-vendor.sh', 'vendor/MANIFEST.tsv') }}

      - name: Fetch vendored dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: scripts/fetch-vendor.sh required

      - name: Cache build/ (cmake + webrtc-apm Meson output)
        uses: actions/cache@v4
        with:
          path: build
          # Invalidate when the chain code or build wiring changes; not on
          # eval-only changes (those don't recompile C++).
          # v3: bust the v2 cache whose ExternalProject stamps were saved
          # with the Debian-multiarch libdir layout. cmake/ glue is now in
          # the hash so ExternalProject config changes invalidate properly.
          key: build-v3-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/*.cc', 'src/**/*.h', 'vendor/MANIFEST.tsv') }}
          restore-keys: |
            build-v3-${{ runner.os }}-

      - name: Configure + build ecnr_bench
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DECNR_BUILD_LIVE=OFF \
            -DECNR_BUILD_EVAL=OFF
          cmake --build build --target ecnr_bench -j$(nproc)
          ./build/ecnr_bench --help 2>&1 | head -3 || true

      - name: Install Python eval deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy onnxruntime librosa

      - name: Cache models/ (DNSMOS + AECMOS ONNX)
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          # Keyed on filename only — model files are versioned upstream by
          # their Microsoft repo SHA; pinning here would require a manual
          # bump on every refresh. URLs below treat 'main' as the moving
          # head, accepting the small drift risk.
          key: models-dnsmos-aecmos-v1

      - name: Download DNSMOS + AECMOS ONNX from upstream LFS
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL \
            "https://media.githubusercontent.com/media/microsoft/DNS-Challenge/master/DNSMOS/sig_bak_ovr.onnx" \
            -o models/dnsmos_p835.onnx
          curl -fsSL \
            "https://media.githubusercontent.com/media/microsoft/AEC-Challenge/main/AECMOS/AECMOS_local/Run_1663915512_Stage_0.onnx" \
            -o models/aecmos.onnx
          ls -la models/

      - name: Fetch AEC-Challenge 30-clip subset
        run: |
          python3 reference/fetch_aec_challenge.py
          wc -l datasets/aec_challenge/MANIFEST.tsv
          ls datasets/aec_challenge/ | wc -l

      - name: Gate run — primary (v0.4.1 default, AGC on)
        id: gate-primary
        run: |
          mkdir -p /tmp/gate_primary
          set +e
          python3 reference/run_aec_challenge.py \
            --bench ./build/ecnr_bench \
            --dnsmos-model models/dnsmos_p835.onnx \
            --aecmos-model models/aecmos.onnx \
            --out-dir /tmp/gate_primary \
            --no-keep-enh-wavs \
            > /tmp/gate_primary/run.log 2>&1
          rc=$?
          set -e
          tail -60 /tmp/gate_primary/run.log | grep -v "onnxruntime" || true
          # ENFORCED: this run's exit code drives the workflow result.
          # Exit code mapping:
          #   0 → CORPUS VERDICT PASS (every enforced metric × scenario p50 ≥ floor)
          #   1 → CORPUS VERDICT BLOCK (one or more enforced floor misses)
          #   2 → cache miss / setup error
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Gate run — regression baseline (--no-agc, legacy AGC off)
        id: gate-baseline
        # Always runs (even if primary failed) so the job summary can show
        # the side-by-side diff for diagnosis. Does NOT affect job result.
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/gate_baseline
          set +e
          python3 reference/run_aec_challenge.py \
            --bench ./build/ecnr_bench \
            --dnsmos-model models/dnsmos_p835.onnx \
            --aecmos-model models/aecmos.onnx \
            --no-agc \
            --out-dir /tmp/gate_baseline \
            --no-keep-enh-wavs \
            > /tmp/gate_baseline/run.log 2>&1
          rc=$?
          set -e
          tail -60 /tmp/gate_baseline/run.log | grep -v "onnxruntime" || true
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Enforce primary gate
        # The primary run's step exits 0 even on BLOCK (we captured rc into
        # an output) so we can run the baseline diff afterwards. This step
        # propagates the BLOCK to the workflow result so PRs that regress
        # actually fail. Setup errors (rc=2) also fail.
        if: steps.gate-primary.outputs.exit_code != '0'
        run: |
          echo "::error::Primary gate (AGC on) exit code ${{ steps.gate-primary.outputs.exit_code }} — fails the workflow."
          echo "See job summary + /tmp/gate_primary/ artifacts for which metric × scenario blocks."
          exit 1

      - name: Post job summary
        if: always()
        run: |
          PRIMARY_RC="${{ steps.gate-primary.outputs.exit_code }}"
          BASELINE_RC="${{ steps.gate-baseline.outputs.exit_code }}"
          case "$PRIMARY_RC" in
            0)  PRIMARY_VERDICT="✅ PASS" ;;
            1)  PRIMARY_VERDICT="❌ BLOCK" ;;
            *)  PRIMARY_VERDICT="⚠️  SETUP ERROR (rc=$PRIMARY_RC)" ;;
          esac
          {
            echo "## AEC-Challenge gate result (ENFORCED)"
            echo
            echo "Per ADR-0012 §2.1 v2 floors + §3.1 applicability matrix. Numbers below are per-scenario p50 against the 30-clip subset."
            echo
            echo "**Primary verdict (workflow gate):** $PRIMARY_VERDICT"
            echo
            echo "### Primary — v0.4.1 default (AGC on)"
            echo '```'
            tail -50 /tmp/gate_primary/run.log 2>/dev/null \
              | grep -v "onnxruntime" \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | tail -40 || echo "(no log)"
            echo '```'
            echo
            echo "### Regression baseline — --no-agc (legacy AGC off, informational)"
            echo
            echo "Side-by-side reference. Does NOT affect workflow result."
            echo '```'
            tail -50 /tmp/gate_baseline/run.log 2>/dev/null \
              | grep -v "onnxruntime" \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | tail -40 || echo "(no log)"
            echo '```'
            echo
            echo "### Per-clip CSVs"
            echo "Available as build artifacts (see Artifacts section below)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-${{ github.run_id }}
          path: |
            /tmp/gate_primary/per_clip.csv
            /tmp/gate_primary/summary.csv
            /tmp/gate_primary/run.log
            /tmp/gate_baseline/per_clip.csv
            /tmp/gate_baseline/summary.csv
            /tmp/gate_baseline/run.log
          retention-days: 30
